name: Sync original NESDC milestone CSVs
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *' # daily 10:20 Thailand time
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Download CSV files from NESDC original download buttons
        id: download
        continue-on-error: true
        run: python sync_nesdc.py
      - name: Commit updated CSV files (including successful partial updates)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csv/
          if ! git diff --cached --quiet; then
            git commit -m "Sync NESDC original milestone CSVs"
            git push
          fi
      - name: Upload screenshots when a milestone fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesdc-debug-screenshots
          path: debug/*.png
          if-no-files-found: ignore
      - name: Report partial failure
        if: steps.download.outcome == 'failure'
        run: |
          echo 'One or more milestones failed; previously saved CSVs were retained.'
          exit 1
