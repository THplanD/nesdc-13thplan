/* Unified milestone header — replaces duplicate heading and three statistics cards */
.refined-detail-top{margin-bottom:18px}

.milestone-summary{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:22px;align-items:stretch;background:#fff;border:1px solid #d9e0eb;border-radius:22px;padding:25px 27px;box-shadow:0 12px 35px rgba(14,64,74,.045);margin-bottom:24px;position:relative;overflow:hidden}
.milestone-summary:before{content:"";position:absolute;left:0;top:23px;bottom:23px;width:4px;border-radius:0 5px 5px 0;background:#092a8d}

.summary-title-wrap{min-width:0;padding-top:1px}

.summary-kicker-divider{color:#98a9cd;padding:0 7px;font-weight:600}
.milestone-summary h1{font-size:clamp(19px,1.65vw,26px);line-height:1.55;letter-spacing:-.4px;color:#122543;margin:0;font-weight:800;overflow-wrap:anywhere}

function parseCSV(s){let lines=[],row=[],value='',quote=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){value+='"';i++}else quote=!quote;}else if(c===','&&!quote){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))lines.push(row);row=[];value=''}else value+=c;}if(value||row.length){row.push(value);lines.push(row)}if(!lines.length)return [];let head=lines.shift();head[0]=head[0].replace(/^\uFEFF/,'');return lines.map(row=>Object.fromEntries(head.map((k,i)=>[k,(row[i]||'').trim()])))}
function getYear(row){for(let i=YEARS.length-1;i>=0;i--)if(numberOrNull(row[YEARS[i]])!==null)return YEARS[i];return null}
function numberOrNull(x){if(x===null||x===undefined)return null;let s=String(x).trim().replace(/,/g,'');if(!s||['-','—','N/A','NA','null'].includes(s))return null;let n=Number(s);return Number.isFinite(n)?n:null}
function formatNumber(v){let n=numberOrNull(v);return n===null?'—':new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(n)}
function fileAvailable(n){return Boolean(state.files[n])}
function rowsFor(n){return state.rows[n]||[]}
function availableCount(){return Object.keys(state.files).filter(k=>state.files[k]).length}
function download(n){if(!fileAvailable(n))return;const url=state.files[n]==='embedded'?'':csvUrl(n);if(url){const a=document.createElement('a');a.href=url;a.download=fileName(n);document.body.appendChild(a);a.click();a.remove()}else{const blob=new Blob(['\uFEFF',state.csv[n]],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fileName(n);a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}

function downloadButton(n,cl='btn primary'){return fileAvailable(n)?`<button class="${cl}" data-download="${n}">${icon('download')} ดาวน์โหลด CSV</button>`:`<button class="${cl}" disabled>${icon('download')} ยังไม่มี CSV</button>`}
function card(n){const rows=rowsFor(n),ok=fileAvailable(n);return `<article class="card"><div class="card-top"><div class="milestone-icon">${icon(iconNames[n-1])}</div></div><div class="card-no">MILESTONE ${String(n).padStart(2,'0')}</div><h3>${esc(titles[n-1])}</h3><div class="card-meta"><span>${ok?`${rows.length} ตัวชี้วัด`:'ยังไม่มีไฟล์ที่เปิดอ่านได้'}</span><span>แผนระดับที่ 2</span></div><div class="card-actions"><button class="btn primary" data-open="${n}">${icon('arrow')} ดูรายละเอียด</button>${downloadButton(n,'btn ghost')}</div></article>`}
function renderOverview(){let sorted=titles.map((t,i)=>[t,i+1]).filter(([t,n])=>`${t} ${n}`.toLowerCase().includes(state.query.toLowerCase()));$('view').innerHTML=heroOverview()+`<div class="tabs"><button data-tab="cards" class="tab ${state.tab==='cards'?'active':''}">หมุดหมายการพัฒนา</button><button data-tab="table" class="tab ${state.tab==='table'?'active':''}">ทะเบียนข้อมูล CSV</button></div><div class="section-header"><div><h2 class="section-title">หมุดหมายทั้งหมด</h2><div class="section-sub">เลือกหมุดหมายเพื่อดูรายละเอียดและผลการดำเนินงาน</div></div><div class="search">${icon('search')}<input id="search" placeholder="ค้นหาหมุดหมาย..." value="${esc(state.query)}" aria-label="ค้นหาหมุดหมาย"></div></div><div id="list-content">${overviewList(sorted)}</div>${footer()}`;let s=$('search');s.addEventListener('input',e=>{state.query=e.target.value;let filtered=titles.map((t,i)=>[t,i+1]).filter(([t,n])=>`${t} ${n}`.toLowerCase().includes(state.query.toLowerCase()));$('list-content').innerHTML=overviewList(filtered)})}
function overviewList(items){if(!items.length)return '<div class="empty">ไม่พบหมุดหมายที่ค้นหา</div>';if(state.tab==='cards')return `<div class="cards">${items.map(([t,n])=>card(n)).join('')}</div>`;return `<div class="panel table-wrap"><table class="table"><thead><tr><th>หมุดหมาย</th><th>จำนวนตัวชี้วัด</th><th>การดำเนินการ</th></tr></thead><tbody>${items.map(([t,n])=>`<tr><td><strong>${String(n).padStart(2,'0')}</strong> ${esc(t)}</td><td>${rowsFor(n).length||'—'}</td><td><button class="btn" data-open="${n}">เปิดรายละเอียด</button></td></tr>`).join('')}</tbody></table></div>`}
function footer(){return `<div class="footer"><span>แหล่งข้อมูล: สำนักงานสภาพัฒนาการเศรษฐกิจและสังคมแห่งชาติ (สศช.)</span><a href="https://13thplan-nesdc.vercel.app/" target="_blank" rel="noopener">เว็บไซต์อ้างอิง ${icon('external')}</a></div>`}
function sparkline(row){let points=YEARS.map(y=>numberOrNull(row[y]));let non=points.filter(v=>v!==null);if(non.length<2)return '<span style="color:#9eafb5;font-size:10px">ไม่มีกราฟ</span>';let mn=Math.min(...non),mx=Math.max(...non),span=mx-mn||1;let coords=points.map((v,i)=>v===null?null:[i*10+2,31-(v-mn)/span*26]);let ds=[],seg=[];coords.forEach(c=>{if(!c){if(seg.length)ds.push(seg);seg=[]}else seg.push(c)});if(seg.length)ds.push(seg);return `<svg class="mini-chart" viewBox="0 0 94 35" preserveAspectRatio="none" role="img" aria-label="แนวโน้มข้อมูล"><path d="M0 33h94" stroke="#e7eeee" stroke-width="1" fill="none"/>${ds.filter(s=>s.length>1).map(s=>`<polyline points="${s.map(p=>p.join(',')).join(' ')}" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`}
function chart(row){const pts=YEARS.map(y=>numberOrNull(row[y]));const pairs=pts.map((v,i)=>({x:i,y:v})).filter(p=>p.y!==null);if(!pairs.length)return '<div class="empty">ยังไม่มีข้อมูลรายปีสำหรับตัวชี้วัดนี้</div>';let vals=pairs.map(p=>p.y),mn=Math.min(0,...vals),mx=Math.max(...vals),span=(mx-mn)||1;const W=650,H=255,L=48,R=20,T=20,B=38;let xx=i=>L+i*(W-L-R)/9, yy=v=>T+(mx-v)/(span)*(H-T-B);let line=pairs.map((p,i)=>(i?'L':'M')+xx(p.x).toFixed(1)+','+yy(p.y).toFixed(1)).join(' ');let labels=[0,.25,.5,.75,1].map(v=>{let value=mn+(mx-mn)*v;let y=yy(value);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e9f0f1"/><text x="${L-9}" y="${y+4}" font-size="11" fill="#819aa2" text-anchor="end">${formatNumber(value)}</text>`}).join('');let target=numberOrNull(row.target);let tline=target!==null&&target>=mn&&target<=mx?`<line x1="${L}" x2="${W-R}" y1="${yy(target)}" y2="${yy(target)}" stroke="#edae52" stroke-width="2" stroke-dasharray="7 5"/>`:'';return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="กราฟแนวโน้มตัวชี้วัดรายปี">${labels}${tline}<path d="${line}" fill="none" stroke="#0d968c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${pairs.map(p=>`<circle cx="${xx(p.x)}" cy="${yy(p.y)}" r="4.8" fill="#fff" stroke="#0d968c" stroke-width="2.8"><title>ปี ${YEARS[p.x]}: ${formatNumber(p.y)} ${esc(row.unit||'')}</title></circle>`).join('')}${YEARS.map((y,i)=>`<text x="${xx(i)}" y="${H-12}" text-anchor="middle" fill="#8aa1a9" font-size="11">${y.slice(2)}</text>`).join('')}</svg>`}
function renderDetail(n){let rows=rowsFor(n),ok=fileAvailable(n);let withData=rows.filter(r=>getYear(r)),last=withData.reduce((max,r)=>Math.max(max,Number(getYear(r))),0)||null;let selected=rows[Math.min(state.selectedIndicator,Math.max(rows.length-1,0))];$('view').innerHTML=`<div class="detail-top refined-detail-top"><div class="eyebrow">NATIONAL DEVELOPMENT PLAN <span class="eyebrow-dot">·</span> MILESTONE ${String(n).padStart(2,'0')}</div><button class="back-btn" data-open="0">${icon('back')} กลับหน้าภาพรวม</button></div><section class="milestone-summary"><div class="milestone-summary-main"><div class="milestone-title-row"><span class="summary-number">${String(n).padStart(2,'0')}</span><div class="summary-title-wrap"><span class="summary-kicker">หมุดหมายที่ ${n} <span class="summary-kicker-divider">/</span> แผนพัฒนาฯ ฉบับที่ 13</span><h1>${esc(titles[n-1])}</h1></div></div><div class="summary-actions">${downloadButton(n)}<a class="btn" target="_blank" rel="noopener noreferrer" href="${srcUrl(n)}">${icon('external')} เปิดต้นทาง</a></div></div><div class="summary-stat"><div class="summary-stat-icon">${icon('chart')}</div><strong>${ok?rows.length:'—'}</strong><span>ตัวชี้วัด</span></div></section>${ok?`<section class="panel"><div class="panel-title"><h3>ตัวชี้วัดและผลการดำเนินงาน</h3><small>คลิกแถวตัวชี้วัดเพื่อแสดงกราฟด้านล่าง</small></div><div class="indicator-list">${rows.map((r,i)=>{let y=getYear(r);return `<div class="indicator"><div><div class="ind-title">${esc(r.indicatorName||r.indicatorTargetText||'ตัวชี้วัด '+(i+1))}</div><div class="ind-goal">${esc(r.goalText||'')} · ${y?'ปีล่าสุด '+y:'ไม่มีข้อมูลรายปี'}</div></div><div class="ind-right">${sparkline(r)}<div class="ind-value"><strong>${y?formatNumber(r[y]):'—'}</strong><small>${esc(r.unit||'')} ${y?'· '+y:''}</small></div><button class="ind-detail-btn" data-indicator="${i}" aria-label="แสดงรายละเอียดตัวชี้วัด">${icon('arrow')}</button></div></div>`}).join('')}</div></section><div class="chart-section" id="chart-panel"><section class="panel"><div class="panel-title"><h3>แนวโน้มผลการดำเนินงานรายปี</h3><small>พ.ศ. 2561–2570</small></div><div style="color:#285663;font-weight:700;font-size:12px;line-height:1.8">${esc(selected?.indicatorName||'')}</div><div class="chart-main">${selected?chart(selected):''}</div><div class="chart-legend"><span style="color:#0c968e">━━</span> ผลการดำเนินงาน ${numberOrNull(selected?.target)!==null?'　<span style="color:#edae52">┄┄</span> ค่าเป้าหมาย':''}</div></section><section class="panel"><div class="panel-title"><h3>รายละเอียดตัวชี้วัด</h3></div><div class="meta-grid"><div><span>หมุดหมาย</span><strong>${n}</strong></div><div><span>ปีข้อมูลล่าสุด</span><strong>${getYear(selected)||'—'}</strong></div><div><span>หน่วยวัด</span><strong>${esc(selected?.unit||'—')}</strong></div><div><span>ค่าเป้าหมาย (ตัวเลข)</span><strong>${numberOrNull(selected?.target)!==null?formatNumber(selected.target):'—'}</strong></div></div><div style="margin-top:18px"><div class="ind-goal" style="font-weight:800">เป้าหมายการพัฒนา</div><p style="line-height:1.9;color:#496b76">${esc(selected?.goalText||'ไม่ระบุ')}</p><div class="ind-goal" style="font-weight:800">รายละเอียดเป้าหมายตัวชี้วัด</div><p style="line-height:1.9;color:#496b76">${esc(selected?.indicatorTargetText||selected?.targetText||'ไม่ระบุ')}</p></div></section></div><section class="panel"><div class="panel-title"><h3>ตารางข้อมูลรายปี</h3><small>ข้อมูลตัวชี้วัดที่เลือก</small></div><div class="table-wrap"><table class="table"><thead><tr><th>ตัวชี้วัด</th>${YEARS.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody><tr><td>${esc(selected?.indicatorName||'')}</td>${YEARS.map(y=>`<td>${numberOrNull(selected?.[y])!==null?formatNumber(selected[y]):'—'}</td>`).join('')}</tr></tbody></table></div></section>`:`<div class="empty"><strong>ยังไม่พบไฟล์ CSV ของหมุดหมายนี้</strong></div>`}${footer()}`}
function render(){if(state.active)renderDetail(state.active);else renderOverview();}
async function load(n){let url=csvUrl(n);try{let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);let txt=await r.text();let rr=parseCSV(txt);if(!rr.length||!rr[0].indicatorId)throw Error('CSV format mismatch');state.csv[n]=txt;state.rows[n]=rr;state.files[n]='remote';}catch(e){if(n===1&&location.protocol==='file:'){state.csv[n]=embeddedCsv;state.rows[n]=parseCSV(embeddedCsv);state.files[n]='embedded';}else {state.files[n]=false;state.rows[n]=[]}}render()}
(async()=>{bind();let initial=Number(new URLSearchParams(location.search).get('milestone'))||0;if(initial<0||initial>13)initial=0;state.active=initial;nav();render();await Promise.all(titles.map((_,i)=>load(i+1)))})();
</script></body></html>
